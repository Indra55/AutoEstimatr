<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Predictor</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="background-container">
        <div class="particles"></div>
        <div class="overlay"></div>
        <div class="content">
            <header>
                <div class="logo">
                    <i class="fas fa-car-side"></i>
                </div>
                <h1>Car Price Predictor</h1>
                <p>Get an instant estimate of your car's value using AI</p>
            </header>
            
            <form id="car-form" method="post" class="glass-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="company">
                            <i class="fas fa-building"></i>
                            Company
                        </label>
                        <select id="company" name="company" required onchange="load_car_models(this.value, 'model')">
                            <option value="" disabled selected>Select Company</option>
                            {% for company in companies %}
                            <option value="{{ company }}">{{ company }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="model">
                            <i class="fas fa-car"></i>
                            Model
                        </label>
                        <select id="model" name="model" required>
                            <option value="" disabled selected>Select Model</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="year">
                            <i class="fas fa-calendar"></i>
                            Year
                        </label>
                        <select id="year" name="year" required>
                            <option value="" disabled selected>Select Year</option>
                            {% for year in years %}
                            <option value="{{ year }}">{{ year }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="fuel-type">
                            <i class="fas fa-gas-pump"></i>
                            Fuel Type
                        </label>
                        <select id="fuel-type" name="fuel_type" required>
                            <option value="" disabled selected>Select Fuel Type</option>
                            {% for fuel in fuel_type %}
                            <option value="{{ fuel }}">{{ fuel }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="kilometers">
                        <i class="fas fa-road"></i>
                        Kilometers Driven
                    </label>
                    <input type="number" id="kilometers" name="kilometers" placeholder="Enter the kilometers driven" required min="0">
                </div>

                <div class="form-group">
                    <button type="submit" class="btn">
                        <span>Predict Price</span>
                        <i class="fas fa-calculator"></i>
                    </button>
                </div>
            </form>

            <div class="prediction-result">
                <h3><span id="prediction"></span></h3>
            </div>
        </div>
    </div>

    <script>
        const carModelsByCompany = {};

        document.addEventListener('DOMContentLoaded', function() {
            {% for company in companies %}
            carModelsByCompany["{{ company }}"] = [
                {% for model in car_models %}
                    {% if model.startswith(company) %}
                    "{{ model }}",
                    {% endif %}
                {% endfor %}
            ];
            {% endfor %}
        });

        function load_car_models(selectedCompany, car_model_id) {
            const car_model_select = document.getElementById(car_model_id);
            car_model_select.innerHTML = "";

            const defaultOption = document.createElement("option");
            defaultOption.text = "Select Model";
            defaultOption.value = "";
            defaultOption.disabled = true;
            defaultOption.selected = true;
            car_model_select.appendChild(defaultOption);

            if (carModelsByCompany[selectedCompany]) {
                carModelsByCompany[selectedCompany].forEach(model => {
                    if (model && model.trim() !== '') {
                        const option = document.createElement("option");
                        option.value = model;
                        option.textContent = model.replace(selectedCompany + ' ', '');
                        car_model_select.appendChild(option);
                    }
                });
            }
        }

        document.getElementById('car-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const formData = new FormData(this);
            const prediction = document.getElementById("prediction");
            prediction.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Calculating...";
            
            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(result => {
                prediction.innerHTML = `<i class="fas fa-tags"></i> Predicted Price: ₹${result}`;
            })
            .catch(error => {
                prediction.innerHTML = `<i class="fas fa-exclamation-circle"></i> Error: ${error.message}`;
            });
        });
    </script>
</body>
</html>
